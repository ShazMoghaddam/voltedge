# VoltEdge — Kubernetes Manifests (EKS / GKE / AKS)
# Deploy to each regional cluster with region-specific ConfigMap values.
# kubectl apply -f deployment.yaml

apiVersion: v1
kind: Namespace
metadata:
  name: voltedge
  labels:
    app.kubernetes.io/managed-by: kubectl

---

apiVersion: apps/v1
kind: Deployment
metadata:
  name: voltedge-api
  namespace: voltedge
  labels:
    app: voltedge-api
    version: "2.0.0"
spec:
  replicas: 3
  selector:
    matchLabels:
      app: voltedge-api
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  template:
    metadata:
      labels:
        app: voltedge-api
    spec:
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              podAffinityTerm:
                labelSelector:
                  matchExpressions:
                    - key: app
                      operator: In
                      values: [voltedge-api]
                topologyKey: topology.kubernetes.io/zone

      containers:
        - name: voltedge-api
          image: ${ECR_REGISTRY}/voltedge-api:${IMAGE_TAG}
          imagePullPolicy: Always
          ports:
            - containerPort: 8000
              name: http
          env:
            - name: ENVIRONMENT
              valueFrom:
                configMapKeyRef:
                  name: voltedge-config
                  key: environment
            - name: CLOUD_PROVIDER
              value: "aws"
            - name: AWS_REGION
              valueFrom:
                configMapKeyRef:
                  name: voltedge-config
                  key: aws_region
            - name: AWS_S3_BUCKET
              valueFrom:
                configMapKeyRef:
                  name: voltedge-config
                  key: s3_bucket
            - name: VOLTEDGE_SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: voltedge-secrets
                  key: jwt_secret_key
            - name: LOG_FORMAT
              value: "json"
          resources:
            requests:
              memory: "512Mi"
              cpu: "250m"
            limits:
              memory: "1Gi"
              cpu: "1000m"
          livenessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 30
            periodSeconds: 30
            timeoutSeconds: 5
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /ready
              port: 8000
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 5
          securityContext:
            runAsNonRoot: true
            runAsUser: 1000
            readOnlyRootFilesystem: true
            allowPrivilegeEscalation: false
            capabilities:
              drop: [ALL]

---

apiVersion: v1
kind: Service
metadata:
  name: voltedge-api
  namespace: voltedge
  annotations:
    service.beta.kubernetes.io/aws-load-balancer-type: "nlb"
    service.beta.kubernetes.io/aws-load-balancer-cross-zone-load-balancing-enabled: "true"
spec:
  type: LoadBalancer
  selector:
    app: voltedge-api
  ports:
    - port: 80
      targetPort: 8000
      name: http

---

apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: voltedge-api-hpa
  namespace: voltedge
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: voltedge-api
  minReplicas: 2
  maxReplicas: 10
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
    - type: Resource
      resource:
        name: memory
        target:
          type: Utilization
          averageUtilization: 80

---

# Regional ConfigMap — override per cluster
apiVersion: v1
kind: ConfigMap
metadata:
  name: voltedge-config
  namespace: voltedge
data:
  environment: "production"
  aws_region: "eu-west-1"
  s3_bucket: "voltedge-data-eu-production"
  log_level: "INFO"
  log_format: "json"
