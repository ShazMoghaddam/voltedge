[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.backends.legacy:build"

[project]
name = "voltedge"
version = "0.1.0"
description = "Enterprise energy intelligence platform with AI-driven forecasting and ESG reporting"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Proprietary" }
authors = [{ name = "VoltEdge Engineering" }]

dependencies = [
    # Data processing
    "pandas>=2.2",
    "numpy>=1.26",
    "pyarrow>=15.0",           # Fast parquet I/O for cloud storage

    # ML / AI
    "scikit-learn>=1.4",
    "tensorflow>=2.15",
    "statsmodels>=0.14",       # ARIMA / statistical forecasting

    # Dashboard & Visualization
    "dash>=2.16",
    "plotly>=5.20",
    "dash-bootstrap-components>=1.5",

    # Configuration & Validation
    "pydantic>=2.6",
    "pydantic-settings>=2.2",
    "python-dotenv>=1.0",

    # Cloud SDKs (free tier)
    "boto3>=1.34",             # AWS S3, DynamoDB, Lambda
    "azure-storage-blob>=12.19",

    # Data ingestion / APIs
    "httpx>=0.27",             # Async HTTP client
    "paho-mqtt>=2.0",          # IoT MQTT protocol

    # Scheduling & Orchestration
    "apscheduler>=3.10",

    # Logging & Observability
    "structlog>=24.1",

    # Utilities
    "tenacity>=8.2",           # Retry logic
    "rich>=13.7",              # Pretty CLI output
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "pytest-cov>=5.0",
    "ruff>=0.3",               # Linting + formatting
    "mypy>=1.9",
    "httpx[asyncio]",
    "faker>=24.0",             # Synthetic data generation for tests
]

[project.scripts]
voltedge = "voltedge.cli:main"

[tool.ruff]
line-length = 100
target-version = "py310"
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.10"
strict = true
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
addopts = "--cov=voltedge --cov-report=term-missing"
